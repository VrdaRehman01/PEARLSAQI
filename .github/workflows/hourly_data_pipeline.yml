name: Hourly AQI Data Pipeline

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

# IMPORTANT:
# Only one workflow is allowed to modify the database at a time.
concurrency:
  group: pearlsaqi-database-writer
  cancel-in-progress: false

jobs:

  hourly-pipeline:

    name: Hourly AQI Production Pipeline

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify dependencies
        run: |
          python -c "import duckdb; print('DuckDB:', duckdb.__version__)"
          python -c "import pandas; print('Pandas:', pandas.__version__)"

      # ============================================================
      # HOURLY INGESTION
      # ============================================================

      - name: Fetch hourly live data
        run: |
          set -e

          echo "=========================================="
          echo "HOURLY LIVE DATA INGESTION"
          echo "=========================================="

          for attempt in 1 2 3; do
            echo "Attempt $attempt/3"

            if python -m src.pipelines.hourly_ingestion_pipeline; then
              echo "Hourly ingestion succeeded."
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Hourly ingestion failed after 3 attempts."
              exit 1
            fi

            echo "Hourly ingestion failed."
            echo "Waiting 30 seconds before retry..."
            sleep 30
          done

      # ============================================================
      # HOURLY -> DAILY
      # ============================================================

      - name: Synchronize hourly data into daily tables
        run: |
          set -e

          echo "=========================================="
          echo "HOURLY -> DAILY SYNCHRONIZATION"
          echo "=========================================="

          for attempt in 1 2 3; do
            echo "Attempt $attempt/3"

            if python -m src.pipelines.hourly_to_daily_pipeline; then
              echo "Hourly -> daily synchronization succeeded."
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Hourly -> daily synchronization failed after 3 attempts."
              exit 1
            fi

            echo "Synchronization failed."
            echo "Waiting 30 seconds before retry..."
            sleep 30
          done

      # ============================================================
      # DATABASE VALIDATION
      # ============================================================

      - name: Verify daily database
        run: |
          python - <<'PY'
          import duckdb
          from datetime import date

          db = "database/aqi.duckdb"

          conn = duckdb.connect(db)

          try:

              print("=" * 70)
              print("DAILY DATABASE VERIFICATION")
              print("=" * 70)

              tables = ["aqi", "weather"]

              for table in tables:

                  latest_date, rows, cities = conn.execute(
                      f"""
                      SELECT
                          MAX(date),
                          COUNT(*),
                          COUNT(DISTINCT city_id)
                      FROM {table}
                      """
                  ).fetchone()

                  print()
                  print(f"{table}:")
                  print(f"  Latest date : {latest_date}")
                  print(f"  Rows        : {rows}")
                  print(f"  Cities      : {cities}")

                  if rows is None or rows == 0:
                      raise RuntimeError(
                          f"{table} contains no rows."
                      )

                  if cities != 12:
                      raise RuntimeError(
                          f"{table} contains {cities} cities; "
                          f"expected 12."
                      )

              aqi_date = conn.execute(
                  "SELECT MAX(date) FROM aqi"
              ).fetchone()[0]

              weather_date = conn.execute(
                  "SELECT MAX(date) FROM weather"
              ).fetchone()[0]

              print()
              print("AQI latest date    :", aqi_date)
              print("Weather latest date:", weather_date)

              if aqi_date is None:
                  raise RuntimeError(
                      "AQI table has no latest date."
                  )

              if weather_date is None:
                  raise RuntimeError(
                      "Weather table has no latest date."
                  )

              if aqi_date != weather_date:
                  raise RuntimeError(
                      "AQI/weather latest dates do not match: "
                      f"{aqi_date} vs {weather_date}"
                  )

              # ------------------------------------------------------
              # Check duplicate daily rows
              # ------------------------------------------------------

              for table in tables:

                  duplicates = conn.execute(
                      f"""
                      SELECT city_id, date, COUNT(*)
                      FROM {table}
                      GROUP BY city_id, date
                      HAVING COUNT(*) > 1
                      LIMIT 20
                      """
                  ).fetchall()

                  if duplicates:

                      raise RuntimeError(
                          f"Duplicate rows found in {table}: "
                          f"{duplicates}"
                      )

              print()
              print("DAILY DATABASE VERIFICATION: PASSED")

          finally:

              conn.close()
          PY

      # ============================================================
      # DATABASE SUMMARY
      # ============================================================

      - name: Print database summary
        run: |
          python - <<'PY'
          import duckdb

          conn = duckdb.connect("database/aqi.duckdb")

          for table in ["aqi", "weather"]:

              result = conn.execute(
                  f"""
                  SELECT
                      MIN(date),
                      MAX(date),
                      COUNT(*),
                      COUNT(DISTINCT city_id)
                  FROM {table}
                  """
              ).fetchone()

              print(
                  f"{table}: "
                  f"min={result[0]}, "
                  f"max={result[1]}, "
                  f"rows={result[2]}, "
                  f"cities={result[3]}"
              )

          conn.close()
          PY

      # ============================================================
      # COMMIT DATABASE
      # ============================================================

      - name: Commit updated database
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f database/aqi.duckdb

          if git diff --cached --quiet; then
            echo "No database changes to commit."
            exit 0
          fi

          git commit -m "chore: update hourly AQI database"

          if git push origin HEAD:${GITHUB_REF_NAME}; then
            echo "Database push succeeded."
            exit 0
          fi

          echo "Remote changed while pipeline was running."
          echo "Refreshing from latest main and regenerating database..."

          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

          python -m src.pipelines.hourly_ingestion_pipeline
          python -m src.pipelines.hourly_to_daily_pipeline

          git add -f database/aqi.duckdb

          if git diff --cached --quiet; then
            echo "No database changes after refresh."
            exit 0
          fi

          git commit -m "chore: update hourly AQI database"

          git push origin HEAD:${GITHUB_REF_NAME}

          echo "Database push succeeded after refresh."

      # ============================================================
      # COMPLETE
      # ============================================================

      - name: Pipeline complete
        run: |
          echo "=========================================="
          echo "PEARLSAQI HOURLY PIPELINE COMPLETE"
          echo "=========================================="
          echo "Hourly ingestion    : PASSED"
          echo "Hourly to daily     : PASSED"
          echo "Database validation : PASSED"
          echo "Database commit     : PASSED"
          echo "=========================================="