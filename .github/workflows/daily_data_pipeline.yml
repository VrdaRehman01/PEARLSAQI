name: Daily AQI Production Pipeline

on:
  workflow_dispatch:

  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

concurrency:
  group: pearlsaqi-database-writer
  cancel-in-progress: false

jobs:

  daily-pipeline:

    name: Daily AQI Production Pipeline

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify dependencies
        run: |
          python -c "import duckdb; print('DuckDB:', duckdb.__version__)"
          python -c "import pandas; print('Pandas:', pandas.__version__)"

      - name: Run daily production pipeline
        run: |
          python -m src.pipelines.daily_forecast_pipeline

      - name: Verify production database
        run: |
          python - <<'PY'
          import duckdb

          conn = duckdb.connect("database/aqi.duckdb")

          for table in [
              "aqi",
              "weather",
              "weather_forecasts",
              "forecast_predictions",
          ]:

              exists = conn.execute(
                  f"""
                  SELECT COUNT(*)
                  FROM information_schema.tables
                  WHERE table_name = '{table}'
                  """
              ).fetchone()[0]

              if exists == 0:
                  raise RuntimeError(
                      f"Required table missing: {table}"
                  )

              count = conn.execute(
                  f"SELECT COUNT(*) FROM {table}"
              ).fetchone()[0]

              print(
                  f"{table}: {count} rows"
              )

              if count == 0:
                  raise RuntimeError(
                      f"Required table is empty: {table}"
                  )

          print("PRODUCTION DATABASE VERIFICATION: PASSED")

          conn.close()
          PY

      - name: Commit updated database
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f database/aqi.duckdb

          if git diff --cached --quiet; then
            echo "No database changes to commit."
            exit 0
          fi

          git commit -m "chore: daily production database update"

          if git push origin HEAD:${GITHUB_REF_NAME}; then
            echo "Push succeeded."
            exit 0
          fi

          echo "Remote changed while pipeline was running."
          echo "Refreshing from latest main and regenerating database..."

          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

          python -m src.pipelines.daily_forecast_pipeline

          git add -f database/aqi.duckdb

          if git diff --cached --quiet; then
            echo "No database changes after refresh."
            exit 0
          fi

          git commit -m "chore: daily production database update"

          git push origin HEAD:${GITHUB_REF_NAME}

          echo "Database push succeeded after refresh."

      - name: Pipeline complete
        run: |
          echo "=========================================="
          echo "PEARLSAQI DAILY PIPELINE COMPLETE"
          echo "=========================================="
          echo "Daily production pipeline : PASSED"
          echo "Database verification     : PASSED"
          echo "Database commit           : PASSED"
          echo "=========================================="