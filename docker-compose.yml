services:

  api:
    build: .
    container_name: pearlsaqi-api
    ports:
      - "5000:5000"
    environment:
      # Keep the database current from GitHub (same as Render).
      REMOTE_DATABASE_URL: https://raw.githubusercontent.com/VrdaRehman01/PEARLSAQI/main/database/aqi.duckdb
      # Optional ground-station readings; set it in .env.
      AQICN_TOKEN: ${AQICN_TOKEN:-}
    restart: unless-stopped
